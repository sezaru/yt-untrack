<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 13px system-ui, sans-serif;
        margin: 0;
        padding: 12px;
        min-width: 250px;
      }
      h1 {
        font-size: 13px;
        margin: 0 0 6px;
      }
      p {
        color: #666;
        margin: 0 0 12px;
        line-height: 1.4;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 0;
        cursor: pointer;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
        flex: none;
      }
      .empty {
        color: #999;
      }
    </style>
  </head>
  <body>
    <h1>Untrack these containers</h1>
    <p>YouTube history and recommendations won't be recorded for tabs opened in checked containers.</p>
    <div id="list"><span class="empty">Loading…</span></div>
    <script src="popup.js"></script>
  </body>
</html>
